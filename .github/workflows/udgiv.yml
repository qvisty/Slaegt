name: Valider slægtsdata

# Siden udgives af GitHub Pages direkte fra mappen docs på grenen main.
# Dette job tjekker data mod arbejdsreglerne ved hver ændring.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tjek slægtsdata mod arbejdsreglerne
        run: node scripts/valider.mjs
